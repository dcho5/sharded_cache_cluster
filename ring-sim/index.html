<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ring Sim: consistent hashing playground</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 900px; margin-inline: auto; }
    canvas { width: 100%; max-width: 520px; aspect-ratio: 1; border: 1px solid #8884; border-radius: 12px; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }
    #log { font: 12px/1.4 ui-monospace, monospace; height: 160px; overflow: auto; border: 1px solid #8884; padding: .5rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Ring Sim</h1>
  <div class="row">
    <button id="add">Add node</button>
    <button id="kill">Kill random node</button>
    <input id="key" placeholder="key" value="user:42" />
    <button id="put">PUT</button>
  </div>
  <canvas id="c" width="520" height="520"></canvas>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
